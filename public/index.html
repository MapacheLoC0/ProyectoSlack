<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unicatólica - Sistema Automático Slack</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      height: 100%;
      overflow: hidden;
    }
    
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #44749d;
      color: #333;
    }
    
    .container {
      height: 100vh;
      overflow-y: hidden; /* Scroll aquí */
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start; /* Cambiado a flex-start */
      padding: 120px 20px 40px; /* Más espacio arriba y abajo */
    }
    
    .logo {
      position: fixed;
      top: 30px;
      left: 30px;
      width: 200px;
      z-index: 10;
    }
    
    .card {
      background-color: #fff;
      border-radius: 10px;
      padding: 30px 40px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
      max-width: 420px;
      width: 100%;
      margin-bottom: 40px; /* Espacio al final */
    }
    
    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.8rem;
      color: #000;
    }
    
    .content-box {
      background-color: rgba(95, 138, 194, 0.2);
      color: #000;
      padding: 25px 30px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    
    .content-box h3 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 1.2rem;
    }
    
    .content-box p {
      text-align: left;
      margin: 4px 0;
      font-size: 0.95rem;
    }
    
    .btn-container {
      text-align: center;
      margin-top: 15px;
    }
    
    .btn-yellow {
      background-color: #ffce5c;
      border: none;
      padding: 10px 25px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }
    
    .btn-yellow:hover {
      background-color: #ffcb33;
    }
    
    .btn-yellow:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    
    .drop-zone {
      border: 2px dashed #ffd766;
      border-radius: 8px;
      padding: 25px;
      margin: 20px 0;
      text-align: center;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s, border 0.3s;
    }
    
    .drop-zone:hover {
      background-color: rgba(255, 215, 102, 0.1);
      border-color: #ffaa00;
    }
    
    .drop-zone p {
      margin: 0;
      opacity: 0.8;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    
    .drop-zone input[type="file"] {
      display: none;
    }
    
    .btn-blue {
      background-color: #5b86a1;
      border: none;
      color: #fff;
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .btn-blue:hover:not(:disabled) {
      background-color: #467289;
    }
    
    .btn-blue:disabled {
      background-color: #99a9b5;
      cursor: not-allowed;
    }
    
    .message {
      padding: 12px;
      border-radius: 6px;
      margin-top: 15px;
      font-size: 0.9rem;
      display: none;
      animation: slideDown 0.3s ease;
    }
    
    .message.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    
    .message.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    
    .result-box {
      background-color: #e7f0f8;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      text-align: left;
      display: none;
      animation: slideDown 0.3s ease;
    }
    
    .result-box h3 {
      margin-top: 0;
      color: #0a3055;
      font-size: 1.2rem;
    }
    
    .result-box h4 {
      margin-bottom: 5px;
      margin-top: 15px;
      font-size: 0.95rem;
      color: #0a3055;
    }
    
    .result-box p {
      margin: 5px 0;
      font-size: 0.9rem;
    }
    
    .result-box ul {
      list-style: none;
      padding: 0;
      margin: 10px 0;
    }
    
    .result-box li {
      padding: 5px;
      margin: 3px 0;
      background: #fff;
      border-radius: 4px;
      font-size: 0.85rem;
    }
    
    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Scrollbar personalizada */
    .container::-webkit-scrollbar {
      width: 8px;
    }
    
    .container::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
    }
    
    .container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
    }
    
    .container::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }
    
    @media (max-height: 700px) {
      .container {
        padding-top: 80px;
      }
      .card {
        padding: 20px 30px;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 15px;
      }
    }

    @media (max-width: 500px) {
      .logo {
        width: 150px;
      }
      .card {
        padding: 20px;
      }
      .container {
        padding: 100px 15px 30px;
      }
    }
  </style>
</head>
<body>
  <img src="unicatolica-logo-blanco-250x77.png" class="logo" alt="Unicatólica Logo" />

  <div class="container">
    <div class="card">
      <h1>Workspace Unicatólica</h1>

      <div class="content-box">
        <h3>Formato del Excel</h3>
        <p><b>Fila 1:</b> NOMBRE_CANAL | nombre-del-canal</p>
        <p><b>Fila 2:</b> DESCRIPCION | Descripción del canal</p>
        <p><b>Fila 3:</b> CORREO</p>
        <p><b>Fila 4:</b> UN CORREO POR FILA</p>

        <div class="btn-container">
          <button class="btn-yellow" id="downloadTemplate">descargar plantilla</button>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept=".xlsx,.xls" />
        <p id="dropText">Haz clic o arrastra el archivo<br><small>solo archivos xlsx o xls.</small></p>
      </div>

      <button class="btn-blue" id="uploadBtn" disabled>Subir</button>

      <div class="message" id="message"></div>
      <div class="result-box" id="results"></div>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const results = document.getElementById('results');
    const message = document.getElementById('message');
    const downloadTemplate = document.getElementById('downloadTemplate');
    const dropText = document.getElementById('dropText');
    const container = document.querySelector('.container');
    
    let selectedFile = null;
    let processing = false;

    downloadTemplate.addEventListener('click', async () => {
      try {
        downloadTemplate.disabled = true;
        downloadTemplate.textContent = 'Descargando...';

        const response = await fetch('/api/download-template');
        const blob = await response.blob();
        
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'plantilla_slack.xlsx';
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);

        showMessage('success', '✅ Plantilla descargada correctamente');
      } catch (error) {
        showMessage('error', '❌ Error descargando plantilla: ' + error.message);
      } finally {
        downloadTemplate.disabled = false;
        downloadTemplate.textContent = 'descargar plantilla';
      }
    });

    dropZone.addEventListener('click', () => !processing && fileInput.click());

    dropZone.addEventListener('dragover', e => {
      e.preventDefault();
      if (!processing) {
        dropZone.style.backgroundColor = 'rgba(255,215,102,0.15)';
      }
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.style.backgroundColor = 'transparent';
    });

    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.style.backgroundColor = 'transparent';
      
      if (processing) return;
      
      const file = e.dataTransfer.files[0];
      if (file && (file.name.endsWith('.xlsx') || file.name.endsWith('.xls'))) {
        handleFileSelect(file);
      } else {
        showMessage('error', '❌ Solo se permiten archivos Excel (.xlsx o .xls)');
      }
    });

    fileInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) {
        handleFileSelect(file);
      }
    });

    function handleFileSelect(file) {
      selectedFile = file;
      dropText.innerHTML = `<b>✓ ${file.name}</b><br><small>Listo para subir</small>`;
      uploadBtn.disabled = false;
      message.style.display = 'none';
      results.style.display = 'none';
    }

    uploadBtn.addEventListener('click', async () => {
      if (!selectedFile || processing) return;

      processing = true;
      uploadBtn.textContent = '⏳ Procesando...';
      uploadBtn.disabled = true;
      message.style.display = 'none';
      results.style.display = 'none';

      try {
        const formData = new FormData();
        formData.append('file', selectedFile);

        const response = await fetch('/api/auto-create-channel', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          showMessage('success', data.message);
          showResults(data);
          
          // Scroll suave hacia resultados
          setTimeout(() => {
            results.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }, 200);
        } else {
          showMessage('error', '❌ ' + (data.error || 'Error desconocido'));
        }
      } catch (error) {
        showMessage('error', '❌ Error al procesar: ' + error.message);
      } finally {
        processing = false;
        uploadBtn.textContent = 'Subir otro archivo';
        uploadBtn.disabled = false;
      }
    });

    function showMessage(type, text) {
      message.className = `message ${type}`;
      message.textContent = text;
      message.style.display = 'block';
    }

    function showResults(data) {
      let html = '<h3>Resultados</h3>';
      html += `<p><strong>Canal:</strong> ${data.channelName || 'N/A'}</p>`;
      html += `<p><strong>Descripción:</strong> ${data.channelDescription || 'Sin descripción'}</p>`;
      html += `<p><strong>ID:</strong> ${data.channelId || 'N/A'}</p>`;

      if (data.summary) {
        html += '<h4> Resumen:</h4>';
        html += `<p>Invitados: <strong>${data.summary.existingInvited}</strong></p>`;
        html += `<p>Fallidos: <strong>${data.summary.existingFailed}</strong></p>`;
        html += `<p>Emails enviados: <strong>${data.summary.newUsersEmailed}</strong></p>`;
        html += `<p>Pendientes: <strong>${data.summary.newUsersPending}</strong></p>`;
        html += `<p>Inválidos: <strong>${data.summary.invalidEmails}</strong></p>`;
      }

      if (data.existingUsers && data.existingUsers.length > 0) {
        html += '<h4>Detalle:</h4><ul>';
        data.existingUsers.forEach(u => {
          const icon = u.status === 'invited' ? '✅' : '❌';
          const reason = u.reason ? ` (${u.reason})` : '';
          html += `<li>${icon} ${u.email}${reason}</li>`;
        });
        html += '</ul>';
      }

      results.innerHTML = html;
      results.style.display = 'block';
    }
  </script>
</body>
</html>
